spring.application.name=alert-service
server.port = 8084

#Kafka consumer
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=alert-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=com.homeenergytracker.usage_service.kafka.event.AlertingEvent:com.homeenergytracker.alert_service.kafka.event.AlertingEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*


# DB conf
spring.datasource.url = jdbc:mysql://localhost:3306/home_energy_tracker
spring.datasource.username=root
spring.datasource.password = ${MYSQL_PASSWORD}
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none


spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

