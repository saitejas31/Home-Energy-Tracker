spring.application.name=device-service

server.port=8081

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/home_energy_tracker
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
#spring.jpa.database-platform=org.hibernate.dialect.MySQL57Dialect
# Flyway is disabled here; all schema migrations (V1-V3) are managed by user-service on startup
spring.flyway.enabled=false
spring.devtools.restart.enabled=true

device.service.base-url=http://localhost:8081
